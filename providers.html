<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>المختصون | Tasbeh Mohamed</title>

    <meta
        name="description"
        content="تعرف على المختصين واحجز جلستك بسهولة."
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        /* =========================================
           Providers
        ========================================= */

        .providers-section {
            padding: 80px 20px;
        }


        .providers-container {
            max-width: 1200px;
            margin: auto;
        }


        .providers-header {
            text-align: center;
            margin-bottom: 40px;
        }


        .providers-header h1 {
            margin-bottom: 12px;
        }


        .providers-header p {
            max-width: 700px;
            margin: auto;
            line-height: 1.9;
            opacity: .75;
        }


        /* =========================================
           Filters
        ========================================= */

        .providers-filters {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 40px;

        }


        .provider-filter {

            border: 1px solid rgba(155,116,58,.35);

            background: transparent;

            color: inherit;

            padding: 10px 18px;

            border-radius: 30px;

            cursor: pointer;

            font-family: inherit;

            transition: .3s ease;

        }


        .provider-filter:hover,
        .provider-filter.active {

            background: #9b743a;

            border-color: #9b743a;

            color: white;

        }


        /* =========================================
           Grid
        ========================================= */

        .providers-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 30px;

        }


        /* =========================================
           Card
        ========================================= */

        .provider-card {

            background: rgba(255,255,255,.85);

            border: 1px solid
                rgba(155,116,58,.18);

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 15px 45px rgba(0,0,0,.07);

            transition: .3s ease;

        }


        .provider-card:hover {

            transform: translateY(-6px);

            box-shadow:
                0 20px 55px rgba(0,0,0,.11);

        }


        /* =========================================
           Provider Top
        ========================================= */

        .provider-top {

            display: flex;

            align-items: center;

            gap: 20px;

            margin-bottom: 20px;

        }


        .provider-image {

            width: 90px;

            height: 90px;

            flex-shrink: 0;

            border-radius: 50%;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #f5eee4,
                    #e6d4ba
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #9b743a;

            font-size: 30px;

        }


        .provider-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .provider-info h2 {

            margin: 0 0 7px;

            font-size: 23px;

        }


        .provider-role {

            margin: 0;

            font-size: 14px;

            opacity: .7;

        }


        /* =========================================
           Description
        ========================================= */

        .provider-description {

            line-height: 1.9;

            opacity: .8;

            margin-bottom: 20px;

        }


        /* =========================================
           Services
        ========================================= */

        .provider-services {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 25px;

        }


        .provider-service {

            padding: 7px 12px;

            border-radius: 20px;

            background:
                rgba(155,116,58,.09);

            color: #8b652e;

            font-size: 12px;

        }


        /* =========================================
           Buttons
        ========================================= */

        .provider-actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .provider-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 11px 18px;

            border-radius: 12px;

            text-decoration: none;

            font-family: inherit;

            font-weight: 600;

            transition: .3s ease;

        }


        .provider-btn.primary {

            background: #9b743a;

            color: white;

        }


        .provider-btn.primary:hover {

            background: #7f5c2d;

        }


        .provider-btn.secondary {

            border:
                1px solid
                rgba(155,116,58,.3);

            color: #9b743a;

            background: transparent;

        }


        .provider-btn.secondary:hover {

            background:
                rgba(155,116,58,.08);

        }


        /* =========================================
           Loading
        ========================================= */

        .providers-loading {

            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 20px;

            opacity: .7;

        }


        .providers-loading i {

            font-size: 32px;

            margin-bottom: 15px;

        }


        /* =========================================
           Empty / Error
        ========================================= */

        .providers-empty,
        .providers-error {

            grid-column: 1 / -1;

            text-align: center;

            padding: 60px 20px;

        }


        .providers-error {

            border-radius: 20px;

            background:
                rgba(180,50,50,.06);

            color: #a33;

        }


        /* =========================================
           Footer
        ========================================= */

        .providers-footer {

            text-align: center;

            padding: 35px 20px;

        }


        .footer-credit {

            font-size: 13px;

            opacity: .65;

        }


        /* =========================================
           Mobile
        ========================================= */

        @media (max-width: 800px) {

            .providers-grid {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 500px) {

            .provider-card {

                padding: 22px;

            }


            .provider-top {

                align-items: flex-start;

            }


            .provider-image {

                width: 70px;

                height: 70px;

            }


            .provider-info h2 {

                font-size: 19px;

            }


            .provider-actions {

                flex-direction: column;

            }


            .provider-btn {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         Header
    ========================================= -->

    <header class="site-header">

        <div class="container">

            <a
                href="index.html"
                class="logo"
            >
                Tasbeh Mohamed
            </a>


            <nav class="navbar">

                <a href="index.html">
                    الرئيسية
                </a>

                <a
                    href="providers.html"
                    class="active"
                >
                    المختصون
                </a>

                <a href="index.html#services">
                    الخدمات
                </a>

                <a href="index.html#contact">
                    تواصل معنا
                </a>

            </nav>

        </div>

    </header>



    <!-- =========================================
         Main
    ========================================= -->

    <main>

        <section class="providers-section">

            <div class="providers-container">


                <div class="providers-header">

                    <h1>
                        المختصون
                    </h1>

                    <p>
                        تعرف على المختصين واختر الخدمة
                        المناسبة لك واحجز جلستك بسهولة.
                    </p>

                </div>



                <!-- Filters -->

                <div
                    id="providersFilters"
                    class="providers-filters"
                >

                    <button
                        class="provider-filter active"
                        data-filter="all"
                        type="button"
                    >

                        الكل

                    </button>

                </div>



                <!-- Providers -->

                <div
                    id="providersGrid"
                    class="providers-grid"
                >

                    <div class="providers-loading">

                        <i
                            class="fa-solid fa-spinner fa-spin"
                        ></i>

                        <p>
                            جاري تحميل المختصين...
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- =========================================
         Footer
    ========================================= -->

    <footer class="providers-footer">

        <div class="footer-credit">

            Prepared By: Eng Ahmad Ramadan

        </div>

    </footer>



    <!-- =========================================
         Supabase
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>



    <!-- =========================================
         Providers JS
    ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                "use strict";


                const grid =
                    document.getElementById(
                        "providersGrid"
                    );


                const filters =
                    document.getElementById(
                        "providersFilters"
                    );


                /* =====================================
                   Check Supabase
                ===================================== */

                if (
                    typeof supabaseClient ===
                    "undefined"
                ) {

                    grid.innerHTML = `

                        <div class="providers-error">

                            <h3>
                                خطأ في الاتصال
                            </h3>

                            <p>
                                لم يتم تحميل Supabase.
                            </p>

                        </div>

                    `;

                    return;

                }



                /* =====================================
                   Load Providers
                ===================================== */

                const {
                    data,
                    error
                } = await supabaseClient

                    .from("providers")

                    .select("*")

                    .eq(
                        "is_active",
                        true
                    )

                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    );



                /* =====================================
                   Error
                ===================================== */

                if (error) {

                    console.error(
                        error
                    );


                    grid.innerHTML = `

                        <div class="providers-error">

                            <h3>
                                حدث خطأ
                            </h3>

                            <p>
                                ${error.message}
                            </p>

                        </div>

                    `;

                    return;

                }



                /* =====================================
                   Empty
                ===================================== */

                if (
                    !data ||
                    data.length === 0
                ) {

                    grid.innerHTML = `

                        <div class="providers-empty">

                            <i
                                class="fa-solid fa-user-group"
                            ></i>

                            <p>
                                لا يوجد مختصون متاحون حاليًا.
                            </p>

                        </div>

                    `;

                    return;

                }



                /* =====================================
                   Escape HTML
                ===================================== */

                function escapeHTML(value) {

                    if (
                        value === null ||
                        value === undefined
                    ) {

                        return "";

                    }


                    return String(value)

                        .replace(
                            /&/g,
                            "&amp;"
                        )

                        .replace(
                            /</g,
                            "&lt;"
                        )

                        .replace(
                            />/g,
                            "&gt;"
                        )

                        .replace(
                            /"/g,
                            "&quot;"
                        )

                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }



                /* =====================================
                   Render
                ===================================== */

                function renderProviders(
                    providers
                ) {

                    grid.innerHTML =
                        providers.map(
                            provider => {

                                const services =
                                    Array.isArray(
                                        provider.services
                                    )
                                        ? provider.services
                                        : [];


                                const serviceHTML =
                                    services.map(
                                        service => `

                                            <span
                                                class="provider-service"
                                            >

                                                ${escapeHTML(
                                                    service
                                                )}

                                            </span>

                                        `
                                    ).join("");


                                const imageHTML =
                                    provider.image_url

                                        ? `

                                            <img
                                                src="${escapeHTML(
                                                    provider.image_url
                                                )}"
                                                alt="${escapeHTML(
                                                    provider.name_ar
                                                )}"
                                            >

                                        `

                                        : `

                                            <i
                                                class="fa-solid fa-user"
                                            ></i>

                                        `;


                                return `

                                    <article
                                        class="provider-card"
                                    >


                                        <div
                                            class="provider-top"
                                        >

                                            <div
                                                class="provider-image"
                                            >

                                                ${imageHTML}

                                            </div>


                                            <div
                                                class="provider-info"
                                            >

                                                <h2>

                                                    ${escapeHTML(
                                                        provider.name_ar
                                                    )}

                                                </h2>


                                                <p
                                                    class="provider-role"
                                                >

                                                    ${escapeHTML(
                                                        provider.role_ar || ""
                                                    )}

                                                </p>

                                            </div>

                                        </div>



                                        <div
                                            class="provider-description"
                                        >

                                            ${escapeHTML(
                                                provider.description_ar || ""
                                            )}

                                        </div>



                                        <div
                                            class="provider-services"
                                        >

                                            ${serviceHTML}

                                        </div>



                                        <div
                                            class="provider-actions"
                                        >


                                            <a
                                                href="provider.html?id=${encodeURIComponent(
                                                    provider.slug
                                                )}"
                                                class="provider-btn secondary"
                                            >

                                                <i
                                                    class="fa-solid fa-user"
                                                ></i>

                                                الملف الشخصي

                                            </a>



                                            <a
                                                href="booking.html?provider=${encodeURIComponent(
                                                    provider.slug
                                                )}"
                                                class="provider-btn primary"
                                            >

                                                <i
                                                    class="fa-solid fa-calendar-check"
                                                ></i>

                                                احجز جلسة

                                            </a>


                                        </div>


                                    </article>

                                `;

                            }
                        ).join("");

                }



                /* =====================================
                   First Render
                ===================================== */

                renderProviders(
                    data
                );



                /* =====================================
                   Create Filters
                ===================================== */

                const services = [];


                data.forEach(
                    provider => {

                        if (
                            Array.isArray(
                                provider.services
                            )
                        ) {

                            provider.services.forEach(
                                service => {

                                    if (
                                        !services.includes(
                                            service
                                        )
                                    ) {

                                        services.push(
                                            service
                                        );

                                    }

                                }
                            );

                        }

                    }
                );



                services.forEach(
                    service => {

                        const button =
                            document.createElement(
                                "button"
                            );


                        button.type =
                            "button";


                        button.className =
                            "provider-filter";


                        button.dataset.filter =
                            service;


                        button.textContent =
                            service;


                        filters.appendChild(
                            button
                        );


                        button.addEventListener(
                            "click",
                            function () {

                                filters
                                    .querySelectorAll(
                                        ".provider-filter"
                                    )
                                    .forEach(
                                        btn => {

                                            btn.classList.remove(
                                                "active"
                                            );

                                        }
                                    );


                                button.classList.add(
                                    "active"
                                );


                                const filtered =
                                    data.filter(
                                        provider => {

                                            return Array.isArray(
                                                provider.services
                                            ) &&
                                            provider.services.includes(
                                                service
                                            );

                                        }
                                    );


                                renderProviders(
                                    filtered
                                );

                            }
                        );

                    }
                );



                /* =====================================
                   All Button
                ===================================== */

                const allButton =
                    filters.querySelector(
                        '[data-filter="all"]'
                    );


                allButton.addEventListener(
                    "click",
                    function () {

                        filters
                            .querySelectorAll(
                                ".provider-filter"
                            )
                            .forEach(
                                btn => {

                                    btn.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        allButton.classList.add(
                            "active"
                        );


                        renderProviders(
                            data
                        );

                    }
                );


            }

        );

    </script>


</body>

</html>
