    <style>
        /* =========================================
           Providers Page
        ========================================= */

        .providers-section {
            padding: 80px 20px;
        }

        .providers-container {
            max-width: 1200px;
            margin: auto;
        }

        .providers-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .providers-header h1 {
            margin-bottom: 12px;
        }

        .providers-header p {
            max-width: 700px;
            margin: auto;
            line-height: 1.9;
            opacity: .8;
        }

        /* Filters */

        .providers-filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
        }

        .provider-filter {
            border: 1px solid rgba(155, 116, 58, .35);
            background: transparent;
            color: inherit;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: .3s ease;
            font-family: inherit;
        }

        .provider-filter:hover,
        .provider-filter.active {
            background: #9b743a;
            color: #fff;
            border-color: #9b743a;
        }

        /* Grid */

        .providers-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 30px;
        }

        /* Card */

        .provider-card {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            padding: 30px;
            background: rgba(255, 255, 255, .8);
            border: 1px solid rgba(155, 116, 58, .18);
            box-shadow: 0 15px 45px rgba(0, 0, 0, .07);
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .provider-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 55px rgba(0, 0, 0, .11);
        }

        .provider-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 22px;
        }

        .provider-image {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, #f5eee4, #e6d4ba);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9b743a;
            font-size: 30px;
        }

        .provider-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .provider-info h2 {
            margin: 0 0 7px;
            font-size: 23px;
        }

        .provider-role {
            margin: 0;
            opacity: .7;
            font-size: 14px;
        }

        .provider-description {
            line-height: 1.9;
            opacity: .82;
            margin-bottom: 20px;
        }

        /* Services */

        .provider-services {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .provider-service {
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(155, 116, 58, .09);
            color: #8b652e;
            font-size: 12px;
        }

        /* Buttons */

        .provider-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .provider-btn {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 18px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 600;
            transition: .3s ease;
        }

        .provider-btn.primary {
            background: #9b743a;
            color: #fff;
        }

        .provider-btn.primary:hover {
            background: #7f5c2d;
            transform: translateY(-2px);
        }

        .provider-btn.secondary {
            border: 1px solid rgba(155, 116, 58, .3);
            color: #9b743a;
            background: transparent;
        }

        .provider-btn.secondary:hover {
            background: rgba(155, 116, 58, .08);
        }

        /* Loading */

        .providers-loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            opacity: .7;
        }

        .providers-loading i {
            font-size: 32px;
            margin-bottom: 15px;
        }

        /* Empty */

        .providers-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            opacity: .7;
        }

        /* Error */

        .providers-error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            border-radius: 20px;
            background: rgba(180, 50, 50, .06);
            color: #a33;
        }

        /* Footer */

        .providers-footer {
            text-align: center;
            padding: 35px 20px;
        }

        .footer-social {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .footer-social a {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid rgba(155, 116, 58, .25);
            color: #9b743a;
            transition: .3s ease;
        }

        .footer-social a:hover {
            background: #9b743a;
            color: #fff;
        }

        .footer-credit {
            font-size: 13px;
            opacity: .65;
        }

        /* Responsive */

        @media (max-width: 800px) {

            .providers-grid {
                grid-template-columns: 1fr;
            }

            .provider-card {
                padding: 24px;
            }

            .providers-section {
                padding: 60px 15px;
            }
        }

        @media (max-width: 500px) {

            .provider-top {
                align-items: flex-start;
            }

            .provider-image {
                width: 70px;
                height: 70px;
            }

            .provider-info h2 {
                font-size: 19px;
            }

            .provider-actions {
                flex-direction: column;
            }

            .provider-btn {
                width: 100%;
            }
        }
    </style>
</head>


<body>

            <a href="index.html" class="logo">

            </a>

            <nav class="navbar">

                <a href="index.html">

                <a href="providers.html" class="active">

                <a href="index.html#services">

            </nav>

        </div>

    <!-- =========================================
         Providers Section
    ========================================= -->

    <main>

        <section class="providers-section">

            <div class="providers-container">

                <div class="providers-header">

                    <h1>
                        المختصون
                    </h1>

                    <p>
                        تعرف على فريق المختصين واختر الشخص المناسب
                        لاحتياجاتك واحجز جلستك بسهولة.
                    </p>

                <!-- Filters -->

                <div

                    id="providersFilters">

                        type="button"

                        data-filter="all">

    <!-- =========================================
         Supabase
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <!-- =========================================
         Providers JavaScript
    ========================================= -->

    <script>

        document.addEventListener("DOMContentLoaded", async () => {

            "use strict";


            /* =========================================
               Elements
            ========================================= */

            const providersGrid =
                document.getElementById("providersGrid");

            const providersFilters =
                document.getElementById("providersFilters");


            /* =========================================
               Check Supabase
            ========================================= */

            if (
                typeof supabaseClient === "undefined" ||
                !supabaseClient
            ) {

                providersGrid.innerHTML = `
                    <div class="providers-error">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <p>
                            تعذر الاتصال بقاعدة البيانات.
                        </p>
                    </div>
                `;

                return;
            }


            /* =========================================
               Escape HTML
            ========================================= */

            function escapeHTML(value) {

                if (value === null || value === undefined) {
                    return "";
                }

                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }


            /* =========================================
               Get Providers
            ========================================= */

            let providers = [];


            async function loadProviders() {

                providersGrid.innerHTML = `
                    <div class="providers-loading">

                        <i class="fa-solid fa-spinner fa-spin"></i>

                        <p>
                            جاري تحميل المختصين...
                        </p>

                    </div>
                `;


                const { data, error } =
                    await supabaseClient
                        .from("providers")
                        .select(`
                            id,
                            name_ar,
                            name_en,
                            slug,
                            role_ar,
                            role_en,
                            description_ar,
                            description_en,
                            services,
                            session_types,
                            image_url,
                            is_active
                        `)
                        .eq("is_active", true)
                        .order("id", {
                            ascending: true
                        });


                if (error) {

                    console.error(
                        "Supabase providers error:",
                        error
                    );

                    providersGrid.innerHTML = `
                        <div class="providers-error">

                            <i class="fa-solid fa-triangle-exclamation"></i>

                            <p>
                                حدث خطأ أثناء تحميل المختصين.
                            </p>

                        </div>
                    `;

                    return;
                }


                providers = data || [];


                if (!providers.length) {

                    providersGrid.innerHTML = `
                        <div class="providers-empty">

                            <i class="fa-solid fa-user-group"></i>

                            <p>
                                لا يوجد مختصون متاحون حاليًا.
                            </p>

                        </div>
                    `;

                    return;
                }


                buildFilters();

                renderProviders(providers);

            }


            /* =========================================
               Build Filters
            ========================================= */

            function buildFilters() {

                const allServices = [];


                providers.forEach(provider => {

                    const services =
                        Array.isArray(provider.services)
                            ? provider.services
                            : [];


                    services.forEach(service => {

                        if (
                            service &&
                            !allServices.includes(service)
                        ) {

                            allServices.push(service);

                        }

                    });

                });


                providersFilters.innerHTML = `
                    <button
                        type="button"
                        class="provider-filter active"
                        data-filter="all">

                        الكل

                    </button>
                `;


                allServices.forEach(service => {

                    const button =
                        document.createElement("button");

                    button.type = "button";

                    button.className =
                        "provider-filter";

                    button.dataset.filter =
                        service;

                    button.textContent =
                        service;


                    providersFilters.appendChild(button);

                });


                providersFilters
                    .querySelectorAll(".provider-filter")
                    .forEach(button => {

                        button.addEventListener(
                            "click",
                            () => {

                                providersFilters
                                    .querySelectorAll(
                                        ".provider-filter"
                                    )
                                    .forEach(btn => {

                                        btn.classList.remove(
                                            "active"
                                        );

                                    });


                                button.classList.add(
                                    "active"
                                );


                                const filter =
                                    button.dataset.filter;


                                if (filter === "all") {

                                    renderProviders(
                                        providers
                                    );

                                    return;
                                }


                                const filtered =
                                    providers.filter(
                                        provider => {

                                            const services =
                                                Array.isArray(
                                                    provider.services
                                                )
                                                    ? provider.services
                                                    : [];


                                            return services.includes(
                                                filter
                                            );

                                        }
                                    );


                                renderProviders(
                                    filtered
                                );

                            }
                        );

                    });

            }


            /* =========================================
               Render Providers
            ========================================= */

            function renderProviders(list) {

                if (!list.length) {

                    providersGrid.innerHTML = `
                        <div class="providers-empty">

                            <i class="fa-solid fa-magnifying-glass"></i>

                            <p>
                                لا يوجد مختص متاح لهذه الخدمة.
                            </p>

                        </div>
                    `;

                    return;
                }


                providersGrid.innerHTML =
                    list.map(provider => {

                        const services =
                            Array.isArray(provider.services)
                                ? provider.services
                                : [];


                        const image =
                            provider.image_url;


                        const imageHTML = image

                            ? `
                                <img
                                    src="${escapeHTML(image)}"
                                    alt="${escapeHTML(
                                        provider.name_ar
                                    )}"
                                    loading="lazy"
                                >
                            `

                            : `
                                <i class="fa-solid fa-user"></i>
                            `;


                        const servicesHTML =
                            services.map(service => {

                                return `
                                    <span class="provider-service">
                                        ${escapeHTML(service)}
                                    </span>
                                `;

                            }).join("");


                        return `

                            <article
                                class="provider-card"
                                data-provider="${escapeHTML(
                                    provider.slug
                                )}">

                                <div class="provider-top">

                                    <div class="provider-image">

                                        ${imageHTML}

                                    </div>


                                    <div class="provider-info">

                                        <h2>
                                            ${escapeHTML(
                                                provider.name_ar
                                            )}
                                        </h2>

                                        <p class="provider-role">

                                            ${escapeHTML(
                                                provider.role_ar ||
                                                provider.role_en ||
                                                ""
                                            )}

                                        </p>

                                    </div>

                                </div>


                                <div class="provider-description">

                                    ${escapeHTML(
                                        provider.description_ar ||
                                        provider.description_en ||
                                        ""
                                    )}

                                </div>


                                <div class="provider-services">

                                    ${servicesHTML}

                                </div>


                                <div class="provider-actions">

                                    <a
                                        href="provider.html?id=${encodeURIComponent(
                                            provider.slug
                                        )}"
                                        class="provider-btn secondary">

                                        <i class="fa-solid fa-user"></i>

                                        الملف الشخصي

                                    </a>


                                    <a
                                        href="booking.html?provider=${encodeURIComponent(
                                            provider.slug
                                        )}"
                                        class="provider-btn primary">

                                        <i class="fa-solid fa-calendar-check"></i>

                                        احجز جلسة

                                    </a>

                                </div>

                            </article>

                        `;

                    }).join("");

            }


            /* =========================================
               Start
            ========================================= */

            await loadProviders();

        });

    </script>

</body>
